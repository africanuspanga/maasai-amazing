name: Supabase Keepalive

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: https://www.maasaiamazingsafaris.com/api/keepalive
    steps:
      - name: Ping production keepalive endpoint
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            "$KEEPALIVE_URL"
